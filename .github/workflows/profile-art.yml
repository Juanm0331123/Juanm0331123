name: Update profile art

# Regenerates the contribution graph, banner and stats card from real data.
# Runs daily, on every push to main that touches the generators/config, and on demand.

"on":
  schedule:
    - cron: "17 11 * * *"   # 06:17 Bogotá (UTC-5)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "scripts/**"
      - "assets/photo.png"
      - ".github/workflows/profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render SVGs
        run: |
          python scripts/render_heatmap.py
          python scripts/render_banner.py
          python scripts/render_card.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[CHORE] Refresh profile art with latest contribution data [skip ci]"
          file_pattern: "data/contributions.json assets/*.svg"
